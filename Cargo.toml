[package]
name = "aiwebengine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["cors"] }
rquickjs = "0.12.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
futures-util = "0.3"
axum-server = "0.8"
# CIDR parsing for server.trusted_proxies: a forwarding header is only
# evidence when the hop that wrote it is one the operator named.
ipnet = "2"
reqwest = { version = "0.13.1", features = ["json", "blocking", "rustls", "multipart", "form"], default-features = false }
serde_urlencoded = "0.7.1"
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
async-graphql = { version = "7.0", features = ["dynamic-schema"] }
async-graphql-axum = "7.0"
lazy_static = "1.4"
utoipa = { version = "5.0", features = ["chrono"] }
clap = { version = "4.0", features = ["derive"] }
toml = "1.0"
figment = { version = "0.10", features = ["toml", "yaml", "env"] }
regex = "1.5"
indexmap = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
url = "2.5"
futures = "0.3.31"
async-stream = "0.3.6"
mime = "0.3"
mime_guess = "2.0"
html-escape = "0.2"
hex = "0.4"
sha2 = "0.11"
# Unified diffs between revisions of a script's files. Hand-rolling the hunk
# grouping around an LCS is a well-known source of off-by-one context bugs, and
# this output is read by people deciding whether to revert.
similar = "2"
rand = "0.10.0"
pulldown-cmark = "0.13.0"
handlebars = "6.0"

# TypeScript/JSX transpilation
oxc = { version = "0.142.0", features = ["full"] }

# Security and encryption (Phase 0.5)
aes-gcm = "0.11"
argon2 = "0.5"
subtle = "2.5"

# OAuth2 and JWT (Phase 2)
oauth2 = "5.0.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
openidconnect = "4.0.1"
async-trait = "0.1"
urlencoding = "2.1.3"
multer = "3.0"

# Database (SQLx)
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "migrate", "uuid", "chrono"] }
# The PostgreSQL server a desktop install starts for itself, behind the
# `embedded-postgres` feature and off by default. It is not a second storage
# backend — it starts a real Postgres on loopback and hands `database.rs` a
# connection string — so a server build compiles none of it and carries none of
# its weight. `tokio` makes command execution async and honour a timeout
# (without it `pg_ctl` blocks the runtime); `theseus` names the release archives
# to install from, and without it `Settings` carries no releases URL at all;
# rustls, matching the rest of the crate, is what fetches one on first run.
postgresql_embedded = { version = "0.21.0", default-features = false, features = [
  "theseus",
  "tokio",
  "tls-rustls-ring",
], optional = true }

# Optimize test builds for faster compilation and execution
[profile.test]
opt-level = 1          # Basic optimizations for tests
debug = 1              # Reduced debug info
codegen-units = 4      # Faster parallel compilation
incremental = true     # Enable incremental compilation

# Even faster for CI/release testing
[profile.test-opt]
inherits = "test"
opt-level = 2
lto = "thin"

# Test-only dependencies
[dev-dependencies]
tokio-test = "0.4"
mockall = "0.15.0"
jsonschema = "0.49"

# Build-time dependencies (for capturing build metadata)
[build-dependencies]
vergen-gix = { version = "10.0.0-beta.5", features = ["build"] }

[features]
# Nothing is on by default: a server deployment reaches a PostgreSQL it does not
# own, and should not pay in binary size, build time or dependency surface for
# code that starts one.
default = []

# Start and supervise a PostgreSQL server inside the engine process, from
# `repository.embedded`. The archive is fetched once on first run and cached in
# the engine's data directory, which keeps this variant cheap to compile and to
# check in CI.
embedded-postgres = ["dep:postgresql_embedded"]

# The same, with the platform's PostgreSQL archive compiled into the binary —
# roughly 30-40 MB, and what a desktop build ships, since a first launch cannot
# depend on the network. Requires network access at *build* time to stage the
# archive.
embedded-postgres-bundled = ["embedded-postgres", "postgresql_embedded/bundled"]
