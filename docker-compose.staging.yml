services:
  # Caddy reverse proxy with automatic HTTPS for staging
  caddy:
    image: caddy:2-alpine
    container_name: aiwebengine-caddy-staging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 support
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    networks:
      - aiwebengine-staging-network
    depends_on:
      - aiwebengine
    healthcheck:
      # Caddy's admin API, not a request through the proxy: every port-80 probe
      # gets the automatic HTTP->HTTPS redirect, and following it means a TLS
      # handshake for a name Caddy holds no certificate for ("localhost"),
      # which resets the connection and reports a healthy proxy as unhealthy.
      # 127.0.0.1 rather than localhost because the admin endpoint binds IPv4
      # only, while localhost resolves to ::1 first inside the image.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Staging deployment
  aiwebengine:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: ghcr.io/lpajunen/aiwebengine:develop
    container_name: aiwebengine-staging
    restart: unless-stopped
    # Expose port only to internal network (not to host)
    expose:
      - "3000"
    # Use this if you want direct access for debugging
    ports:
      - "127.0.0.1:3000:3000"
    # No volumes: this service reads nothing from disk but its configuration,
    # which the image carries. Scripts and assets live in Postgres, migrations
    # are embedded in the binary by sqlx::migrate!, and logs go to stdout for
    # Docker to collect — the ./scripts, ./data and ./logs mounts this replaced
    # were bind mounts onto directories no code has opened since the repository
    # moved into the database.
    environment:
      - RUST_LOG=info
      # Auth configuration
      - APP_AUTH__JWT_SECRET=${APP_AUTH__JWT_SECRET:-staging-jwt-secret-minimum-32-characters-required}
      - APP_AUTH__BOOTSTRAP_ADMINS=${APP_AUTH__BOOTSTRAP_ADMINS:-["admin@example.com"]}
      # Google OAuth
      - APP_AUTH__PROVIDERS__GOOGLE__CLIENT_ID=${APP_AUTH__PROVIDERS__GOOGLE__CLIENT_ID:-}
      - APP_AUTH__PROVIDERS__GOOGLE__CLIENT_SECRET=${APP_AUTH__PROVIDERS__GOOGLE__CLIENT_SECRET:-}
      - APP_AUTH__PROVIDERS__GOOGLE__REDIRECT_URI=${APP_AUTH__PROVIDERS__GOOGLE__REDIRECT_URI:-}
      # Microsoft OAuth
      - APP_AUTH__PROVIDERS__MICROSOFT__CLIENT_ID=${APP_AUTH__PROVIDERS__MICROSOFT__CLIENT_ID:-}
      - APP_AUTH__PROVIDERS__MICROSOFT__CLIENT_SECRET=${APP_AUTH__PROVIDERS__MICROSOFT__CLIENT_SECRET:-}
      - APP_AUTH__PROVIDERS__MICROSOFT__REDIRECT_URI=${APP_AUTH__PROVIDERS__MICROSOFT__REDIRECT_URI:-}
      - APP_AUTH__PROVIDERS__MICROSOFT__TENANT_ID=${APP_AUTH__PROVIDERS__MICROSOFT__TENANT_ID:-common}
      # Apple OAuth (optional)
      - APP_AUTH__PROVIDERS__APPLE__CLIENT_ID=${APP_AUTH__PROVIDERS__APPLE__CLIENT_ID:-}
      - APP_AUTH__PROVIDERS__APPLE__CLIENT_SECRET=${APP_AUTH__PROVIDERS__APPLE__CLIENT_SECRET:-}
      - APP_AUTH__PROVIDERS__APPLE__REDIRECT_URI=${APP_AUTH__PROVIDERS__APPLE__REDIRECT_URI:-}
      - APP_AUTH__PROVIDERS__APPLE__TEAM_ID=${APP_AUTH__PROVIDERS__APPLE__TEAM_ID:-}
      # Security
      - APP_SECURITY__API_KEY=${APP_SECURITY__API_KEY:-staging-api-key}
      # CSRF & session encryption keys (base64 encoded 32-byte values)
      - APP_SECURITY__CSRF_KEY=${APP_SECURITY__CSRF_KEY:-}
      - APP_SECURITY__SESSION_ENCRYPTION_KEY=${APP_SECURITY__SESSION_ENCRYPTION_KEY:-}
      - APP_SECURITY__SECRET_ENCRYPTION_KEY=${APP_SECURITY__SECRET_ENCRYPTION_KEY:-}
      # Repository
      - APP_REPOSITORY__DATABASE_URL=postgresql://aiwebengine:${POSTGRES_PASSWORD:-staging-password}@postgres:5432/aiwebengine_staging
    networks:
      - aiwebengine-staging-network
    healthcheck:
      # The runtime image installs ca-certificates and libssl3 and nothing
      # else, so curl is not present and this check could only ever fail. A
      # TCP connect is what the image can do unaided; the database-aware probe
      # of /health still happens, at the proxy, via Caddy's active health
      # checks, which is where it decides traffic anyway.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/3000' || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # PostgreSQL database for staging
  postgres:
    image: postgres:16-alpine
    container_name: aiwebengine-postgres-staging
    restart: unless-stopped
    environment:
      - POSTGRES_DB=aiwebengine_staging
      - POSTGRES_USER=aiwebengine
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-staging-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aiwebengine-staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwebengine"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Expose PostgreSQL port for debugging
    ports:
      - "5432:5432"

  # Prometheus for metrics
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: aiwebengine-prometheus-staging
  #   restart: unless-stopped
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus
  #   networks:
  #     - aiwebengine-staging-network
  #   ports:
  #     - "9090:9090"
  #   depends_on:
  #     - aiwebengine

  # Grafana for visualization
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: aiwebengine-grafana-staging
  #   restart: unless-stopped
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-staging-admin}
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #     - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
  #     - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
  #   networks:
  #     - aiwebengine-staging-network
  #   ports:
  #     - "3001:3000"
  #   depends_on:
  #     - prometheus

networks:
  aiwebengine-staging-network:
    driver: bridge

volumes:
  caddy-data:      # Caddy certificates and data
  caddy-config:    # Caddy configuration
  caddy-logs:      # Caddy access logs
  postgres-data:
  # prometheus-data:
  # grafana-data:
