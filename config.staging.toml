# Staging Configuration  
# This configuration bridges development and production for testing
# Copy this file to config.toml for staging deployments: cp config.staging.toml config.toml
# Set secrets via environment variables (see .env.example)

[server]
host = "0.0.0.0"
port = 8080
# Base URL for OAuth metadata and redirects - update for your staging domain
base_url = "https://staging.softagen.com"
# Proxies whose X-Forwarded-For and X-Real-IP this engine believes. Entries are
# addresses or CIDR networks; the Docker bridge range below covers Caddy in the
# compose stack. A request that does not arrive from one of these is keyed by
# the address it connected from, whatever its headers claim — which is what
# stops an attacker rotating one header to get a fresh rate-limit bucket per
# request. Leave it empty when nothing sits in front of the engine.
trusted_proxies = ["172.16.0.0/12"]
# Moderate timeout for staging testing
request_timeout_secs = 15
# Keep-alive timeout in seconds
keep_alive_timeout_secs = 60
# Maximum concurrent connections
max_connections = 5000
# Enable graceful shutdown
graceful_shutdown = true
# Shutdown timeout in seconds
shutdown_timeout_secs = 30

[logging]
# Info level for staging debugging
level = "info"
# Log format (json, pretty, compact)
format = "json"
# Enable file logging
file_enabled = true
# Log file path
file_path = "./logs/aiwebengine-staging.log"
# Log file rotation size in MB
file_max_size_mb = 100
# Number of rotated log files to keep
file_max_files = 14
# Enable console logging
console_enabled = true

[javascript]
# Moderate timeout for staging testing (milliseconds)
execution_timeout_ms = 5000
# Medium memory limit for staging (bytes)
max_memory_bytes = 67108864  # 64 MB
# Maximum concurrent script executions
max_concurrent_executions = 100
# Enable script compilation caching
enable_compilation_cache = true
# Maximum number of cached compiled scripts
max_cached_scripts = 1000
# Script execution stack size (bytes)
stack_size_bytes = 131072
# Enable script init() function calls
enable_init_functions = true
# Init function timeout in milliseconds (defaults to execution_timeout_ms if not set)
# init_timeout_ms = 10000
# Budget for one test module in milliseconds (defaults to execution_timeout_ms)
test_timeout_ms = 30000
# Ceiling on a whole test run in milliseconds; the run then reports what it has
test_run_timeout_ms = 120000
# Fail server startup if any script init fails
fail_startup_on_init_error = false

[repository]
# PostgreSQL is the only supported storage backend
# Set via APP_REPOSITORY__DATABASE_URL environment variable
# database_url is set via environment variable

# Maximum script size in bytes (1 MB)
max_script_size_bytes = 1048576
# Maximum asset size in bytes (10 MB)
max_asset_size_bytes = 10485760
# Maximum upload file size in bytes (10 MB)
max_upload_size_bytes = 10485760

# Maximum PostgreSQL connections. Every JavaScript database call holds one
# for its whole round trip, so this caps concurrent script database work.
max_connections = 20
# Maximum number of log messages per script
max_log_messages_per_script = 100
# Log message retention time in hours
log_retention_hours = 48
# Enable automatic log pruning
auto_prune_logs = true

# Session guards, in milliseconds. Postgres is the only party that can
# interrupt a database call: a script's execution budget is enforced between
# JavaScript operations and cannot reach inside a host call, and the request
# timeout abandons the thread without stopping the work on it. Without these,
# one statement blocked on a lock waits forever while holding its own locks,
# and every later writer queues behind it. 0 disables a guard.
#
# How long a statement waits for a lock before giving up. Set inside the
# JavaScript budget, so a handler learns it lost the race with time to answer.
lock_timeout_ms = 5000
# How long any single statement may run. A backstop, not a policy — migrations
# are exempt.
statement_timeout_ms = 30000
# How long a transaction may sit idle before Postgres ends it and releases its
# locks. This is what reaps a transaction whose handler was abandoned mid-run.
idle_in_transaction_timeout_ms = 300000

[security]
# Anonymous users get minimal read-only capabilities. Must stay false outside
# local development; when false (with auth enabled), the CSRF, session and
# secret encryption keys below are mandatory at startup.
development_mode = false
# Hold every session to the address it was signed in from. Off by default,
# because a phone changing networks mid-session would be signed out for it; on a
# deployment whose callers do not move it is cheap, and it makes a stolen
# session token work only from the place it was stolen from. Meaningful only
# because server.trusted_proxies establishes the address from the connection
# rather than from a header the caller wrote.
strict_ip_validation = false
enable_cors = true
# Allow staging and development origins
cors_allowed_origins = ["https://staging.yourdomain.com", "http://localhost:3000"]
# Enable CSRF protection in staging
enable_csrf = true
# Optional: base64-encoded 32-byte CSRF key (set via APP_SECURITY__CSRF_KEY)
csrf_key = "${APP_SECURITY__CSRF_KEY}"
# Enable rate limiting in staging
enable_rate_limiting = true
# Moderate rate limiting for staging
rate_limit_per_minute = 500
# Security headers
enable_security_headers = true
# Content Security Policy
content_security_policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
# Request validation
enable_request_validation = true
# Maximum request body size in bytes (5 MB)
max_request_body_bytes = 5242880
# Optional: base64-encoded 32-byte session encryption key (set via APP_SECURITY__SESSION_ENCRYPTION_KEY)
session_encryption_key = "${APP_SECURITY__SESSION_ENCRYPTION_KEY}"
# secret encryption key for at-rest encryption of DB-stored secrets (set via APP_SECURITY__SECRET_ENCRYPTION_KEY)
secret_encryption_key = "${APP_SECURITY__SECRET_ENCRYPTION_KEY}"
# Set via APP_SECURITY__API_KEY environment variable
api_key = "${APP_SECURITY__API_KEY}"

[performance]
# Enable compression in staging
enable_compression = true
# Compression level (1-9)
compression_level = 6
# Response caching (enabled in staging)
enable_response_cache = true
# Response cache TTL in seconds (30 minutes)
response_cache_ttl_secs = 1800
# Maximum number of cached responses
max_cached_responses = 500
# Worker thread pool size (None = use Tokio default)
# worker_threads = 4
# Enable metrics collection
enable_metrics = true
# Metrics collection interval in seconds
metrics_interval_secs = 60

# Authentication Configuration

[revisions]
# Script revision history. Every write records what the script's files became,
# so this decides how much of that is kept. A labelled revision, the newest
# revision whose init() succeeded, and the newest revision of each script are
# kept regardless of these settings.
prune_enabled = true
retention_days = 30
keep_per_script = 50
prune_interval_secs = 3600

[auth]
# Enable authentication in staging
enabled = true

# JWT secret for session management (minimum 32 characters)
# MUST be set via APP_AUTH_JWT_SECRET environment variable
jwt_secret = "${APP_AUTH_JWT_SECRET}"

# Session timeout in seconds (1 hour)
session_timeout = 3600

# Absolute maximum session age in seconds (30 days)
max_session_age = 2592000

# Maximum concurrent sessions per user
max_concurrent_sessions = 5

# Bootstrap admin emails for staging environment
# Set via APP_AUTH_BOOTSTRAP_ADMINS environment variable (comma-separated)
bootstrap_admins = []

[auth.cookie]
name = "aiwebengine_session"
path = "/"
# Use secure cookies in staging if HTTPS is available
secure = true
http_only = true
same_site = "lax"

# OAuth Providers Configuration
# All secrets MUST be set via environment variables


# Internal credentials — accounts this engine authenticates itself.
#
# All off by default. A password endpoint is the most-probed thing an engine
# can expose, so each switch is turned on deliberately. Two reasons a server
# deployment wants some of this anyway:
#
#   - solutions whose users should not have to hand a real-world identity to
#     Google, Microsoft or Apple just to use them, and
#   - break-glass access for an administrator when the external provider is
#     down or misconfigured, which is otherwise a way to be locked out of your
#     own engine.
#
# Accounts created this way arrive in the authenticated tier and nothing more;
# reaching editor or administrator takes an administrator granting the role.
[auth.internal]
# Accept username-and-password logins against credentials stored here.
enabled = true
# Let anyone create an account.
#
# This is open sign-up: anybody who can reach this host can make an account.
# Two things bound what that is worth. It lands in the authenticated tier,
# which holds nothing that touches scripts, assets or schema — see the tier
# table in CLAUDE.md. And it is recorded in the realm of the host it was
# created on, so an account made through a solution's sign-up form is not a
# principal on a management host.
#
# Turn this off if the solutions on this instance do not want their users
# signing themselves up; accounts then exist only because an administrator or
# a guest claim created them.
allow_registration = true
# Let a caller with no credential be issued an identity and a session.
#
# A guest owns storage and can be granted roles like any other account; it
# simply has no way to be signed into again until it claims a username and
# password, which keeps the same user_id and everything already attached to
# it.
allow_guests = true
# Local usernames that hold the administrator role. The bootstrap_admins of an
# engine with no OAuth provider: that list matches an email address, which only
# a provider can verify, so on a personal install it can never name anybody and
# the owner's own account has no road to the administrator tier at all. Naming a
# username here is not a credential — reaching the account still takes its
# password. Applied on every sign-in, so naming an account that already exists
# works too. Break-glass equivalent: aiwebengine --grant-role <name> administrator
bootstrap_admin_usernames = []
# Minimum password length. The engine enforces a floor of 8 regardless.
min_password_length = 12

[auth.providers.google]
client_id = "${APP_AUTH_PROVIDERS_GOOGLE_CLIENT_ID}"
client_secret = "${APP_AUTH_PROVIDERS_GOOGLE_CLIENT_SECRET}"
redirect_uri = "${APP_AUTH_PROVIDERS_GOOGLE_REDIRECT_URI}"
scopes = ["openid", "email", "profile"]

# Optional: Microsoft Azure AD
# [auth.providers.microsoft]
# client_id = "${APP_AUTH_PROVIDERS_MICROSOFT_CLIENT_ID}"
# client_secret = "${APP_AUTH_PROVIDERS_MICROSOFT_CLIENT_SECRET}"
# redirect_uri = "${APP_AUTH_PROVIDERS_MICROSOFT_REDIRECT_URI}"
# tenant_id = "${APP_AUTH_PROVIDERS_MICROSOFT_TENANT_ID}"
# scopes = ["openid", "email", "profile", "User.Read"]
