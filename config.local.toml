# Local Development Configuration
# This configuration is optimized for local development with verbose logging and relaxed security
# Copy this file to config.toml and customize as needed: cp config.local.toml config.toml

[server]
# Use 0.0.0.0 to be accessible from Caddy container
host = "0.0.0.0"
port = 3000
# Optional: Base URL for OAuth metadata and redirects
# If not set, will auto-construct from host and port (e.g., http://localhost:3000)
# base_url = "http://localhost:3000"
# Proxies whose X-Forwarded-For and X-Real-IP this engine believes. Entries are
# addresses or CIDR networks; the Docker bridge range below covers Caddy in the
# compose stack. A request that does not arrive from one of these is keyed by
# the address it connected from, whatever its headers claim — which is what
# stops an attacker rotating one header to get a fresh rate-limit bucket per
# request. Leave it empty when nothing sits in front of the engine.
trusted_proxies = ["172.16.0.0/12"]
# Enable graceful shutdown
graceful_shutdown = true
# Shutdown timeout in seconds
shutdown_timeout_secs = 30

[logging]
# Verbose logging for development debugging
level = "debug"
# Log format (json, pretty, compact)
format = "pretty"

[javascript]
# Short execution timeout for quick feedback (milliseconds)
execution_timeout_ms = 1000
# Small memory limit for development testing (bytes)
max_memory_bytes = 16777216  # 16 MB
# How many scripts may run at once. Each one holds a blocking thread and a
# QuickJS runtime allowed max_memory_bytes, so this and that setting together
# are the engine's memory ceiling. A caller past the limit waits for a slot
# rather than being refused, inside the timeout it already had.
max_concurrent_executions = 50
# Stack a script may use before QuickJS throws, in bytes. A JavaScript frame
# costs on the order of a kilobyte, so this is about 500 frames of recursion;
# 64 KB would be about 59, which a recursive walk over any real structure
# exceeds. QuickJS raises an error the script can catch rather than taking
# the process down, so the cost of setting it too low is failed scripts.
stack_size_bytes = 524288
# Enable script init() function calls
enable_init_functions = true
# Init function timeout in milliseconds (defaults to execution_timeout_ms if not set)
# init_timeout_ms = 2000
# Budget for one test module in milliseconds (defaults to execution_timeout_ms)
test_timeout_ms = 30000
# Ceiling on a whole test run in milliseconds; the run then reports what it has
test_run_timeout_ms = 120000

[repository]
# PostgreSQL is the only supported storage backend
# Database URL is set via environment variable: APP_REPOSITORY__DATABASE_URL
# The double underscore __ maps to the nested config: repository.database_url
# Set in .env file or export directly: export APP_REPOSITORY__DATABASE_URL="postgresql://..."
# database_url is set via environment variable

# Maximum script size in bytes (1 MB)
max_script_size_bytes = 1048576
# Maximum upload file size in bytes (10 MB)
max_upload_size_bytes = 10485760

# Maximum PostgreSQL connections. Every JavaScript database call holds one
# for its whole round trip, so this caps concurrent script database work.
max_connections = 10

# Session guards, in milliseconds. Postgres is the only party that can
# interrupt a database call: a script's execution budget is enforced between
# JavaScript operations and cannot reach inside a host call, and the request
# timeout abandons the thread without stopping the work on it. Without these,
# one statement blocked on a lock waits forever while holding its own locks,
# and every later writer queues behind it. 0 disables a guard.
#
# How long a statement waits for a lock before giving up. Set inside the
# JavaScript budget, so a handler learns it lost the race with time to answer.
lock_timeout_ms = 5000
# How long any single statement may run. A backstop, not a policy — migrations
# are exempt.
statement_timeout_ms = 30000
# How long a transaction may sit idle before Postgres ends it and releases its
# locks. This is what reaps a transaction whose handler was abandoned mid-run.
idle_in_transaction_timeout_ms = 300000

[security]
# Hold every session to the address it was signed in from. Off by default,
# because a phone changing networks mid-session would be signed out for it; on a
# deployment whose callers do not move it is cheap, and it makes a stolen
# session token work only from the place it was stolen from. Meaningful only
# because server.trusted_proxies establishes the address from the connection
# rather than from a header the caller wrote.
strict_ip_validation = false
# Origins allowed to read engine-owned responses (/engine, /auth, /graphql,
# /mcp). Each entry is an origin — scheme://host[:port], no path — matched
# exactly. Empty means same-origin only, which is the default.
#
# A named origin may send the session cookie with its request; "*" cannot, since
# a browser refuses to pair a wildcard with credentials. So list the front ends
# you develop against rather than reaching for "*", or a signed-in admin UI on
# another port will read nothing.
enable_cors = true
cors_allowed_origins = [
    "http://localhost:3000",
    "http://localhost:5173",
    "https://localhost",
]
# Throwaway keys, so a local install starts without generating any. LOCAL
# DEVELOPMENT ONLY: they are published in this repository, so anyone can forge a
# session or read a secret encrypted with them. Generate your own for anything
# reachable by anyone else: openssl rand -base64 32
csrf_key = "bG9jYWwtZGV2ZWxvcG1lbnQtY3NyZi1rZXktbm90LXNlY3JldA=="
# Security headers
enable_security_headers = true
# Content Security Policy
content_security_policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
# Maximum request body size in bytes (1 MB)
max_request_body_bytes = 1048576
# Throwaway; see the note above csrf_key.
session_encryption_key = "bG9jYWwtZGV2ZWxvcG1lbnQtc2Vzc2lvbi1rZXktbm90LXNlY3JldA=="
# Throwaway; see the note above csrf_key.
secret_encryption_key = "bG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1ub3Qtc2VjcmV0"
# Optional: API key for machine-to-machine authentication (override with APP_SECURITY__API_KEY env var)
api_key = "dev-api-key-12345"

# Authentication Configuration

[revisions]
# Script revision history. Every write records what the script's files became,
# so this decides how much of that is kept. A labelled revision, the newest
# revision whose init() succeeded, and the newest revision of each script are
# kept regardless of these settings.
prune_enabled = true
retention_days = 30
keep_per_script = 50
prune_interval_secs = 3600

[logs]
# Script logs, and how much of each script's log survives. Both dials are
# enforced and either one alone is enough to remove a line: the count bounds a
# script that logs in a loop, and the age bounds the dormant scripts that would
# otherwise sit on their full quota forever. Unlike [revisions], where a
# revision has to fall outside both before it goes — a log line is a
# diagnostic, not history.
prune_enabled = true
retention_hours = 24
keep_per_script = 100
prune_interval_secs = 3600

[auth]
# Enable authentication in development
enabled = true

# JWT secret for session management (minimum 32 characters).
# Throwaway, like the encryption keys above, and published in this repository
# for the same reason: a local install should start without ceremony. Set
# APP_AUTH__JWT_SECRET to your own for anything anyone else can reach.
jwt_secret = "local-install-jwt-secret-not-a-real-one"

# Session timeout in seconds (1 hour)
session_timeout = 3600

# Absolute maximum session age in seconds (30 days)
max_session_age = 2592000

# Maximum concurrent sessions per user
max_concurrent_sessions = 10

# Bootstrap admin emails
# Users with these emails will automatically receive Administrator role on first sign-in
# This allows you to bootstrap the system with an initial admin who can then
# grant roles to other users through the /engine/admin UI
#
# FOR LOCAL DEVELOPMENT: Add your own email here
# Example: bootstrap_admins = ["your-email@gmail.com", "another@example.com"]
#
# Note: To set via environment variable, use JSON array format:
# export APP_AUTH_BOOTSTRAP_ADMINS='["your-email@gmail.com"]'
bootstrap_admins = [
    "admin@example.com",
]

[auth.cookie]
# Cookie settings for development
name = "aiwebengine_session"
secure = false  # Set to true in production with HTTPS

# OAuth Providers Configuration
# Configure at least one provider to enable authentication
# Set secrets via environment variables (see .env.example):
#   APP_AUTH_PROVIDERS_GOOGLE_CLIENT_ID
#   APP_AUTH_PROVIDERS_GOOGLE_CLIENT_SECRET
#   APP_AUTH_PROVIDERS_GOOGLE_REDIRECT_URI

# Internal credentials — accounts this engine authenticates itself, with no
# third-party provider behind them. Everything here is off by default; a
# personal install turns it on because it is the point of running one.
#
# A guest gets an identity and a session with no credential at all: stable
# storage, ownership and a display name without surrendering an address. They
# can later claim the account by attaching a username and password, keeping
# everything the guest built up.
[auth.internal]
# Accept username-and-password logins against credentials stored here.
enabled = true
# Let anyone create an account. Leave off on a server unless the solutions it
# hosts want open signup.
allow_registration = true
# Let a caller with no credential be issued an identity and a session.
allow_guests = true
# Local usernames that hold the administrator role. The bootstrap_admins of an
# engine with no OAuth provider: that list matches an email address, which only
# a provider can verify, so on a personal install it can never name anybody and
# the owner's own account has no road to the administrator tier at all. Naming a
# username here is not a credential — reaching the account still takes its
# password. Applied on every sign-in, so naming an account that already exists
# works too. Break-glass equivalent: aiwebengine --grant-role <name> administrator
# Sign in as this account and you administer the engine. Registration is open
# in this template, so: create it once on the sign-in page, and it is yours.
bootstrap_admin_usernames = ["admin"]
# Minimum password length. The engine enforces a floor of 8 regardless.
min_password_length = 12

[auth.providers.google]
client_id = "${APP_AUTH_PROVIDERS_GOOGLE_CLIENT_ID}"
client_secret = "${APP_AUTH_PROVIDERS_GOOGLE_CLIENT_SECRET}"
redirect_uri = "http://localhost:3000/auth/callback/google"
scopes = ["openid", "email", "profile"]

# Microsoft Azure AD (values overridden by environment variables)
[auth.providers.microsoft]
client_id = "placeholder"
client_secret = "placeholder"
redirect_uri = "http://localhost:3000/auth/callback/microsoft"
tenant_id = "common"
scopes = ["openid", "email", "profile", "User.Read"]

# Optional: Apple Sign In
# Uncomment and set via environment variables to enable
# [auth.providers.apple]
# client_id = "${APP_AUTH_PROVIDERS_APPLE_CLIENT_ID}"
# client_secret = "${APP_AUTH_PROVIDERS_APPLE_CLIENT_SECRET}"
# redirect_uri = "http://localhost:3000/auth/callback/apple"
# team_id = "${APP_AUTH_PROVIDERS_APPLE_TEAM_ID}"
# key_id = "${APP_AUTH_PROVIDERS_APPLE_KEY_ID}"
# private_key = """${APP_AUTH_PROVIDERS_APPLE_PRIVATE_KEY}"""

