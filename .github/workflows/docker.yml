# The gate every change passes before an image is published.
#
# The cargo jobs below are the same commands `make check` runs on a developer's
# machine, invoked through the same Makefile targets on purpose: a gate that
# restates its commands in YAML is a second definition to keep in step with the
# first, and the two drift silently because only one of them is ever run by
# hand. `build-and-test` needs all of them, so a failing test stops the image
# rather than being published beside it.
name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# A newer push to the same branch supersedes this run. Tags and main are
# excluded: those runs publish, and an image half-built is worse than one built
# twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # Verify the sqlx::query! macros against ./.sqlx rather than against the
  # service container. A compile-time connection would be checked against a
  # database that has not been migrated yet — the test harness migrates its own
  # template at runtime — so offline mode is both the working choice and a gate
  # on .sqlx being up to date.
  SQLX_OFFLINE: 'true'

jobs:
  # Formatting, clippy, the TypeScript declarations, and the embedded-database
  # supervisor. One job because they share a build: `check-embedded` is the same
  # crate with one more feature, and a second job would mean a second multi-
  # gigabyte cache for a few minutes of saved wall time.
  lint:
    name: Format, clippy and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting
        run: make format-check

      - name: Run clippy
        run: make lint

      - name: Run TypeScript declaration checks
        run: make typecheck

      # Compile-checks src/embedded_db.rs, which no other job builds: the
      # feature is off by default, and the test harness must not enable it —
      # an engine that starts its own PostgreSQL is the one thing a suite
      # claiming slot databases on DATABASE_URL cannot have. Non-bundled, so
      # this type-checks every line without staging a platform archive.
      - name: Compile-check the embedded database supervisor
        run: make check-embedded

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # DATABASE_URL names a *server*: every test process claims a numbered slot
    # database on it and recreates that slot from a migrated template
    # (tests/common/testdb.rs), so the database named here is only ever the
    # maintenance connection. That is also why the service user is the
    # container's superuser — the harness runs CREATE DATABASE.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aiwebengine
          POSTGRES_USER: aiwebengine
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiwebengine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://aiwebengine:devpassword@localhost:5432/aiwebengine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Fail loudly here rather than passing quietly later. A test whose
      # database will not answer leaves the globals unset and returns without
      # asserting anything (tests/common/mod.rs), so an unreachable server is a
      # green run over a suite that tested nothing. The service container's
      # health check covers the usual case; this covers the rest.
      - name: Verify the database server answers
        run: |
          pg_isready -h localhost -p 5432 -U aiwebengine
          psql "$DATABASE_URL" -c 'SELECT 1' >/dev/null
          echo "database reachable"

      - name: Run tests
        run: make test

  build-and-test:
    name: Build and push image
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            # Tag main branch as latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Capture git metadata for build
        id: git-meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_timestamp=$(git log -1 --format=%cI)" >> $GITHUB_OUTPUT
          echo "build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%S%z)" >> $GITHUB_OUTPUT

      - name: Build and push production Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ steps.git-meta.outputs.sha }}
            GIT_COMMIT_TIMESTAMP=${{ steps.git-meta.outputs.commit_timestamp }}
            BUILD_TIMESTAMP=${{ steps.git-meta.outputs.build_timestamp }}

  security-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
