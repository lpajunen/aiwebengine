# cargo-deny: what the dependency tree may contain. `make deny` runs it; CI
# runs it on every push.
#
# The engine is MIT OR Apache-2.0, so a dependency must be usable under terms
# compatible with that: permissive licenses only, no copyleft. A crate offering
# a choice (`MIT OR GPL-2.0`) passes on its permissive option.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, including unmaintained and unsound
# crates. An exception names the advisory and says why it does not apply.
ignore = [
  # unsafe-libyaml is unmaintained. It arrives through figment's `yaml` feature,
  # which reads an optional config.yaml; dropping that format removes it.
  { id = "RUSTSEC-2024-0449", reason = "only parses the operator's own config file" },
]

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "PostgreSQL",
  # Unicode data tables (icu_*, unicode-ident).
  "Unicode-3.0",
  # The Mozilla root certificate list (webpki-root-certs).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# MPL-2.0 is copyleft per file, not per program: it binds changes to these
# crates' own files, never the code that links them, so used unmodified they
# put nothing on the engine. Servo's CSS parsing, through dom_query, which
# `convert.extract_article` and `convert.parse_feed` read HTML with. Named one
# by one, so another MPL-2.0 crate still needs a decision.
exceptions = [
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  { allow = ["MPL-2.0"], crate = "selectors" },
]

[bans]
# Two versions of one crate are normal in a tree this size; report, don't fail.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
