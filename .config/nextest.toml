# Configuration for cargo-nextest (faster test runner)
# Install with: cargo install cargo-nextest
# Run with: cargo nextest run

[profile.default]
# nextest runs each test in its own process, and `src/test_db.rs` gives each
# process its own database, so tests share no state and run alongside each
# other. (`execute_startup_scripts` executes every script it finds, so a shared
# database would make one test run the scripts another had just written.)
test-threads = 8

# Timeout for individual tests (prevents hanging)
slow-timeout = { period = "60s", terminate-after = 3 }

# No retries. A test that only passes on the second attempt is a test with a
# race in it, and re-running it hides exactly the failure worth seeing. If the
# suite starts needing this again, that is the finding, not the fix.
retries = 0

[[profile.default.overrides]]
filter = 'test(integration)'
# Integration tests get longer timeout
slow-timeout = { period = "120s" }

[profile.ci]
# CI-specific settings
test-threads = 4
slow-timeout = { period = "180s", terminate-after = 5 }
retries = 0
