name: aiwebengine

services:
  # Caddy reverse proxy with automatic HTTPS
  caddy:
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:2-alpine
        COPY Caddyfile.production /etc/caddy/Caddyfile
    # image: caddy:2-alpine
    container_name: aiwebengine-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 support
    volumes:
      # - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    networks:
      - aiwebengine-network
    depends_on:
      aiwebengine-1:
        condition: service_healthy
      aiwebengine-2:
        condition: service_healthy
    healthcheck:
      # Caddy's admin API, not a request through the proxy: every port-80 probe
      # gets the automatic HTTP->HTTPS redirect, and following it means a TLS
      # handshake for a name Caddy holds no certificate for ("localhost"),
      # which resets the connection and reports a healthy proxy as unhealthy.
      # 127.0.0.1 rather than localhost because the admin endpoint binds IPv4
      # only, while localhost resolves to ::1 first inside the image.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Production deployment - Instance 1
  aiwebengine-1:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: aiwebengine:latest
    container_name: aiwebengine-1
    restart: unless-stopped
    # Expose port only to internal network (not to host)
    expose:
      - "3000"
    # Use this if you want direct access for debugging (not recommended in production)
    # ports:
    #   - "127.0.0.1:3000:3000"
    # No volumes: this service reads nothing from disk but its configuration,
    # which the image carries. Scripts and assets live in Postgres, migrations
    # are embedded in the binary by sqlx::migrate!, and logs go to stdout for
    # Docker to collect — the ./scripts, ./data and ./logs mounts this replaced
    # were bind mounts onto directories no code has opened since the repository
    # moved into the database.
    # Every APP_* setting comes from one per-environment file, named by
    # ENV_FILE. Listing keys here instead would set each one whether the
    # environment defines it or not: `${VAR:-}` is an empty value, and an empty
    # value overrides config.toml just as a real one does.
    env_file:
      # required: false so that `docker compose down`, `ps` and `logs` still
      # work in a checkout that has no env file yet. A run without one starts
      # from config.toml alone and stops on the first missing secret, which is
      # a clearer failure than a compose parse error.
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      # The two that describe the topology rather than the environment. A
      # managed database is named in the env file instead, and what it sets is
      # used because this default only applies when the variable is absent.
      APP_REPOSITORY__DATABASE_URL: ${APP_REPOSITORY__DATABASE_URL:-postgresql://aiwebengine:${POSTGRES_PASSWORD:-change-this-password}@postgres:5432/aiwebengine}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - aiwebengine-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/3000' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Production deployment - Instance 2
  aiwebengine-2:
    image: aiwebengine:latest
    container_name: aiwebengine-2
    restart: unless-stopped
    # Expose port only to internal network (not to host)
    expose:
      - "3000"
    # No volumes: this service reads nothing from disk but its configuration,
    # which the image carries. Scripts and assets live in Postgres, migrations
    # are embedded in the binary by sqlx::migrate!, and logs go to stdout for
    # Docker to collect — the ./scripts, ./data and ./logs mounts this replaced
    # were bind mounts onto directories no code has opened since the repository
    # moved into the database.
    # Every APP_* setting comes from one per-environment file, named by
    # ENV_FILE. Listing keys here instead would set each one whether the
    # environment defines it or not: `${VAR:-}` is an empty value, and an empty
    # value overrides config.toml just as a real one does.
    env_file:
      # required: false so that `docker compose down`, `ps` and `logs` still
      # work in a checkout that has no env file yet. A run without one starts
      # from config.toml alone and stops on the first missing secret, which is
      # a clearer failure than a compose parse error.
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      # The two that describe the topology rather than the environment. A
      # managed database is named in the env file instead, and what it sets is
      # used because this default only applies when the variable is absent.
      APP_REPOSITORY__DATABASE_URL: ${APP_REPOSITORY__DATABASE_URL:-postgresql://aiwebengine:${POSTGRES_PASSWORD:-change-this-password}@postgres:5432/aiwebengine}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - aiwebengine-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/3000' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: aiwebengine-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=aiwebengine
      - POSTGRES_USER=aiwebengine
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aiwebengine-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwebengine"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment to expose PostgreSQL port
    # ports:
    #   - "5432:5432"

  # Optional: Prometheus for metrics (future enhancement)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: aiwebengine-prometheus
  #   restart: unless-stopped
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus
  #   networks:
  #     - aiwebengine-network
  #   ports:
  #    - "9090:9090"
  #  depends_on:
  #    - aiwebengine

  # Optional: Grafana for visualization (future enhancement)
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: aiwebengine-grafana
  #   restart: unless-stopped
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #     - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
  #     - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
  #   networks:
  #     - aiwebengine-network
  #   ports:
  #     - "3001:3000"
  #   depends_on:
  #     - prometheus

networks:
  aiwebengine-network:
    driver: bridge

volumes:
  caddy-data:      # Caddy certificates and data
  caddy-config:    # Caddy configuration
  caddy-logs:      # Caddy access logs
  postgres-data:
  # prometheus-data:
  # grafana-data:
