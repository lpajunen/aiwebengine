# The development overlay: the server stack, with the engine containers
# replaced by ones that build from source.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml ...
#
# and never on its own — every service it names is defined in
# docker-compose.yml. The Makefile's DEV_COMPOSE is what assembles the pair,
# along with the handful of values Caddy reads; use `make docker-local`,
# `make docker-localhost` or `make docker-dns` rather than writing it out.
#
# Why an overlay rather than a second stack. This is the option whose whole
# purpose is rehearsing the deployment — TLS, the X-Forwarded-For chain, cookie
# Secure/__Host- behaviour, multi-host routing, cross-instance invalidation over
# LISTEN/NOTIFY — and a rehearsal against a different compose file, different
# service names, a different Caddyfile and a different instance count rehearses
# something else. What is genuinely different here is one thing: these
# containers carry a toolchain and compile the crate, which is a different kind
# of container rather than the same container with different parameters. That
# difference is what an overlay is for, and it is all this file contains.
#
# Everything else — the Caddyfile, the site block, the health checks, the
# X-Forwarded-For handling, the profiles, the number of instances — comes from
# the server file and is therefore the same thing being tested.

# The engine containers, once. Both instances take the same treatment; only
# instance 2's extra ordering constraint differs.
x-engine-dev: &engine-dev
  build:
    context: .
    dockerfile: Dockerfile.local
  volumes:
    # The crate is compiled inside the container, so its inputs are mounted:
    # include_str!/include_bytes! resolve assets/ at build time and
    # sqlx::migrate! embeds migrations/. Nothing here is read at runtime.
    - ./src:/app/src:ro
    - ./tests:/app/tests:ro
    - ./Cargo.toml:/app/Cargo.toml:ro
    - ./Cargo.lock:/app/Cargo.lock:ro
    - ./migrations:/app/migrations:ro
    - ./assets:/app/assets:ro
    - ./build.rs:/app/build.rs:ro
    # Offline query metadata for the sqlx::query! macros. Without it the build
    # has no way to verify them: the container compiles before it runs, so on a
    # fresh volume the schema they are checked against does not exist yet.
    # Regenerate on the host with `cargo sqlx prepare` after changing one.
    - ./.sqlx:/app/.sqlx:ro
    # The one configuration file; per-environment values arrive through
    # env_file, which the server compose file already declares.
    - ./config.toml:/app/config.toml:ro
    - cargo-registry:/usr/local/cargo/registry
    - cargo-git:/usr/local/cargo/git
    # One target directory for both instances, deliberately. They compile
    # byte-identical code, and cargo takes a lock on the directory — so the
    # second instance waits for the first and then finds its build fresh,
    # instead of spending a second full compile and a second copy of the
    # artifacts to reach the same binary. Two caches is what made a cold start
    # of this stack take twice as long as it needed to.
    - target-cache:/app/target
  environment:
    APP_SERVER__HOST: 0.0.0.0
    APP_SERVER__PORT: "3000"
    RUST_BACKTRACE: "1"
    # Verify the query! macros against ./.sqlx rather than a live database.
    SQLX_OFFLINE: "true"
  healthcheck:
    # curl exists in the development image, so this can be the real probe
    # /health — it runs a SELECT 1 and answers 503 when Postgres is
    # unreachable — rather than the TCP connect the slim runtime image is
    # limited to. The long start_period is the compile: a cold container builds
    # the whole crate before it listens, and until that finishes the container
    # reports "starting" rather than unhealthy.
    test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 900s
  stdin_open: true
  tty: true

services:
  caddy:
    build:
      context: .
      # Same configuration as the server image — the Caddyfile and the site
      # directory are copied identically — with the DNS plugin added, which is
      # the one thing a development certificate needs and a server one does
      # not. The plugin is inert unless a `tls` block names it, so this image
      # is a superset rather than a variant: TLS_SNIPPET=tls_internal behaves
      # here exactly as it would on the stock image.
      dockerfile_inline: |
        FROM caddy:2-builder AS builder
        RUN xcaddy build --with github.com/caddy-dns/digitalocean

        FROM caddy:2-alpine
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
        COPY Caddyfile /etc/caddy/Caddyfile
        COPY caddy-sites /etc/caddy/sites
    image: aiwebengine-caddy:dev
    environment:
      # Only read by the tls_acme_dns snippet, so an empty value is fine in
      # every other mode.
      DIGITALOCEAN_TOKEN: ${DIGITALOCEAN_TOKEN:-}
    depends_on:
      aiwebengine-1:
        # service_started, not service_healthy as the server file has it: a
        # cold engine container compiles the crate before it listens, and
        # waiting a quarter of an hour for the proxy to come up hides whether
        # the proxy itself is working. It answers 502 until the engine is
        # there, which is the honest report.
        condition: service_started

  aiwebengine-1:
    <<: *engine-dev

  aiwebengine-2:
    <<: *engine-dev
    depends_on:
      postgres:
        condition: service_healthy
      # Not a runtime dependency: both instances mount the same cargo-registry
      # volume, and the image ships ~6800 files under it from `cargo install
      # cargo-watch`. Docker copies an image path's content into a named volume
      # only while that volume is empty, and it does so per container with no
      # lock between them — so two instances starting together on a volume
      # freshly wiped by `down -v` both copy, and the loser dies before it runs
      # with "failed to mkdir .../index/.../.cache: file exists". Waiting for
      # instance 1 to start means the volume is already populated, which is the
      # case where the copy is skipped entirely.
      aiwebengine-1:
        condition: service_started

  postgres:
    # Published to the host, which the server stack deliberately does not do.
    # This is what `source .env-local && cargo run` and the integration suite
    # connect to, and it is the reason not to run this stack on a shared or
    # exposed machine: the password is in a tracked file.
    ports:
      - "5432:5432"

volumes:
  cargo-registry:
  cargo-git:
  target-cache:
