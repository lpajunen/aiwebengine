services:
  # Caddy reverse proxy with DigitalOcean DNS plugin for Let's Encrypt
  caddy-dev:
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:2-builder AS builder
        RUN xcaddy build --with github.com/caddy-dns/digitalocean
        
        FROM caddy:2-alpine
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    container_name: aiwebengine-caddy-dev
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Only read by the tls_acme_dns snippet, so an empty value is fine in
      # localhost mode.
      - DIGITALOCEAN_TOKEN=${DIGITALOCEAN_TOKEN:-}
      # The Caddyfile's defaults live here, not there: Caddy honours
      # `{$VAR:default}` only for a variable that is *unset*, and compose always
      # sets every key it lists. An empty SITE_HOSTS leaves the site block with
      # no address, which fails to adapt and takes the whole proxy down with it.
      # `make docker-dns` overrides both.
      - SITE_HOSTS=${SITE_HOSTS:-localhost, 127.0.0.1, local.test}
      - TLS_SNIPPET=${TLS_SNIPPET:-tls_internal}
    networks:
      - aiwebengine-dev-network
    depends_on:
      - aiwebengine-dev-1
      - aiwebengine-dev-2
    healthcheck:
      # Caddy's admin API rather than a request through the proxy — a port-80
      # probe gets the automatic HTTP->HTTPS redirect and then fails the TLS
      # handshake for a name held by no certificate. 127.0.0.1 because the
      # admin endpoint binds IPv4 only while localhost resolves to ::1 first.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Development server with hot-reload - Instance 1
  aiwebengine-dev-1:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: aiwebengine-dev-1
    restart: unless-stopped
    # Expose port only to internal network
    expose:
      - "3000"
    # Uncomment for direct access (bypassing Caddy)
    # ports:
    #   - "3000:3000"
    volumes:
      # Mount source code for hot-reload
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./Cargo.toml:/app/Cargo.toml:ro
      - ./Cargo.lock:/app/Cargo.lock:ro
      # Mount migrations (required for sqlx::migrate! macro)
      - ./migrations:/app/migrations:ro
      # Offline query metadata for the two sqlx::query! macros in the code.
      # Without it the build has no way to verify them: the container has no
      # DATABASE_URL at compile time, and could not usefully have one — it
      # compiles before it runs, so on a fresh volume the schema those macros
      # are checked against does not exist yet. Regenerate on the host with
      # `cargo sqlx prepare` after changing one of them.
      - ./.sqlx:/app/.sqlx:ro
      # The one configuration file; per-environment values come from
      # .env-local, which this stack loads via env_file.
      - ./config.toml:/app/config.toml:ro
      # Mount scripts for testing
      - ./scripts:/app/scripts:ro
      # Mount assets
      - ./assets:/app/assets:ro
      # Mount docs for development
      - ./docs:/app/docs:ro
      # No ./logs or ./data: logging goes to stdout and the repository lives in
      # Postgres. The source, migrations and assets above are mounted because
      # this container compiles the crate — include_str! resolves them at build
      # time — not because anything reads them at runtime.
      # Cache cargo registry and target to speed up builds
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/app/target
    env_file:
      - path: ${ENV_FILE:-.env-local}
        required: false
    environment:
      # Topology, not environment: inside this network the database is
      # postgres-dev, whereas .env-local names localhost for host-side
      # `cargo run` and the test suite.
      APP_REPOSITORY__DATABASE_URL: postgresql://aiwebengine:devpassword@postgres-dev:5432/aiwebengine
      APP_SERVER__HOST: 0.0.0.0
      APP_SERVER__PORT: "3000"
      RUST_BACKTRACE: "1"
      # Verify the query! macros against ./.sqlx rather than a live database.
      SQLX_OFFLINE: "true"
    networks:
      - aiwebengine-dev-network
    depends_on:
      postgres-dev:
        condition: service_healthy
    healthcheck:
      # curl is present in the development image, so this can be the real probe
      # /health rather than a TCP connect: it runs a SELECT 1 and answers 503
      # when Postgres is unreachable. The long start_period is the compile — a
      # cold container builds the whole crate before it listens, and until that
      # finishes the container reports "starting" rather than unhealthy.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 900s
    stdin_open: true
    tty: true

  # Development server with hot-reload - Instance 2
  aiwebengine-dev-2:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: aiwebengine-dev-2
    restart: unless-stopped
    # Expose port only to internal network
    expose:
      - "3000"
    volumes:
      # Mount source code for hot-reload
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./Cargo.toml:/app/Cargo.toml:ro
      - ./Cargo.lock:/app/Cargo.lock:ro
      # Mount migrations (required for sqlx::migrate! macro)
      - ./migrations:/app/migrations:ro
      # Offline query metadata for the two sqlx::query! macros in the code.
      # Without it the build has no way to verify them: the container has no
      # DATABASE_URL at compile time, and could not usefully have one — it
      # compiles before it runs, so on a fresh volume the schema those macros
      # are checked against does not exist yet. Regenerate on the host with
      # `cargo sqlx prepare` after changing one of them.
      - ./.sqlx:/app/.sqlx:ro
      # The one configuration file; per-environment values come from
      # .env-local, which this stack loads via env_file.
      - ./config.toml:/app/config.toml:ro
      # Mount scripts for testing
      - ./scripts:/app/scripts:ro
      # Mount assets
      - ./assets:/app/assets:ro
      # Mount docs for development
      - ./docs:/app/docs:ro
      # No ./logs or ./data: logging goes to stdout and the repository lives in
      # Postgres. The source, migrations and assets above are mounted because
      # this container compiles the crate — include_str! resolves them at build
      # time — not because anything reads them at runtime.
      # Cache cargo registry and target to speed up builds
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache-2:/app/target
    env_file:
      - path: ${ENV_FILE:-.env-local}
        required: false
    environment:
      # Topology, not environment: inside this network the database is
      # postgres-dev, whereas .env-local names localhost for host-side
      # `cargo run` and the test suite.
      APP_REPOSITORY__DATABASE_URL: postgresql://aiwebengine:devpassword@postgres-dev:5432/aiwebengine
      APP_SERVER__HOST: 0.0.0.0
      APP_SERVER__PORT: "3000"
      RUST_BACKTRACE: "1"
      # Verify the query! macros against ./.sqlx rather than a live database.
      SQLX_OFFLINE: "true"
    networks:
      - aiwebengine-dev-network
    depends_on:
      postgres-dev:
        condition: service_healthy
      # Not a runtime dependency: both instances mount the same cargo-registry
      # volume, and the image ships ~6800 files under it from `cargo install
      # cargo-watch`. Docker copies an image path's content into a named volume
      # only while that volume is empty, and it does so per container with no
      # lock between them — so two instances starting together on a volume
      # freshly wiped by `down -v` both copy, and the loser dies before it runs
      # with "failed to mkdir .../index/.../.cache: file exists". Waiting for
      # instance 1 to start means the volume is already populated, which is the
      # case where the copy is skipped entirely.
      aiwebengine-dev-1:
        condition: service_started
    healthcheck:
      # curl is present in the development image, so this can be the real probe
      # /health rather than a TCP connect: it runs a SELECT 1 and answers 503
      # when Postgres is unreachable. The long start_period is the compile — a
      # cold container builds the whole crate before it listens, and until that
      # finishes the container reports "starting" rather than unhealthy.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 900s
    stdin_open: true
    tty: true

  # Development PostgreSQL
  postgres-dev:
    image: postgres:16-alpine
    container_name: aiwebengine-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=aiwebengine
      - POSTGRES_USER=aiwebengine
      - POSTGRES_PASSWORD=devpassword
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - aiwebengine-dev-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwebengine"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  aiwebengine-dev-network:
    driver: bridge

volumes:
  cargo-registry:
  cargo-git:
  target-cache:
  target-cache-2:
  postgres-dev-data:
  caddy-data:
  caddy-config:
