      - "3000"
    volumes:
      # Mount source code for hot-reload
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./Cargo.toml:/app/Cargo.toml:ro
      - ./Cargo.lock:/app/Cargo.lock:ro
      # Mount migrations (required for sqlx::migrate! macro)
      - ./migrations:/app/migrations:ro
      # Offline query metadata for the two sqlx::query! macros in the code.
      # Without it the build has no way to verify them: the container has no
      # DATABASE_URL at compile time, and could not usefully have one — it
      # compiles before it runs, so on a fresh volume the schema those macros
      # are checked against does not exist yet. Regenerate on the host with
      # `cargo sqlx prepare` after changing one of them.
      - ./.sqlx:/app/.sqlx:ro
      # Mount configuration (using config.local.toml as config.local.toml)
      - ./config.local.toml:/app/config.local.toml:ro
      # Mount scripts for testing
      - ./scripts:/app/scripts:ro
      # Mount assets
      - ./assets:/app/assets:ro
      # Mount docs for development
      - ./docs:/app/docs:ro
      # Persist logs
      - ./logs:/app/logs
      # Persist database
      - ./data:/app/data
      # Cache cargo registry and target to speed up builds
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache-2:/app/target
    environment:
      # Two instances at `debug` with sqlx's statement logging on makes the
      # foreground `docker-compose up` unreadable — every query is printed with
      # its full SQL. The default below keeps engine-level debug without the
      # crates behind it; a RUST_LOG in the shell or in .env wins over it, which
      # is what the hardcoded `debug` this replaced was quietly overriding.
      - RUST_LOG=${RUST_LOG:-info,aiwebengine=debug,sqlx=warn}
      - RUST_BACKTRACE=1
      # Verify the query! macros against ./.sqlx rather than a live database.
      - SQLX_OFFLINE=true
      # Server configuration  
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=3000
      # PostgreSQL connection (note: double underscores for nested config)
      - APP_REPOSITORY__DATABASE_URL=postgresql://aiwebengine:devpassword@postgres-dev:5432/aiwebengine
      # Auth configuration
      - APP_AUTH__JWT_SECRET=${APP_AUTH__JWT_SECRET:-dev-jwt-secret-minimum-32-characters-required-for-security}
      - APP_AUTH__BOOTSTRAP_ADMINS=${APP_AUTH__BOOTSTRAP_ADMINS:-["admin@example.com"]}
      # Google OAuth
      - APP_AUTH__PROVIDERS__GOOGLE__CLIENT_ID=${APP_AUTH__PROVIDERS__GOOGLE__CLIENT_ID:-}
      - APP_AUTH__PROVIDERS__GOOGLE__CLIENT_SECRET=${APP_AUTH__PROVIDERS__GOOGLE__CLIENT_SECRET:-}
      - APP_AUTH__PROVIDERS__GOOGLE__REDIRECT_URI=${APP_AUTH__PROVIDERS__GOOGLE__REDIRECT_URI:-http://localhost:3000/auth/callback/google}
      # Microsoft OAuth
      - APP_AUTH__PROVIDERS__MICROSOFT__CLIENT_ID=${APP_AUTH__PROVIDERS__MICROSOFT__CLIENT_ID:-}
      - APP_AUTH__PROVIDERS__MICROSOFT__CLIENT_SECRET=${APP_AUTH__PROVIDERS__MICROSOFT__CLIENT_SECRET:-}
      - APP_AUTH__PROVIDERS__MICROSOFT__REDIRECT_URI=${APP_AUTH__PROVIDERS__MICROSOFT__REDIRECT_URI:-https://local.softagen.com/auth/callback/microsoft}
      - APP_AUTH__PROVIDERS__MICROSOFT__TENANT_ID=${APP_AUTH__PROVIDERS__MICROSOFT__TENANT_ID:-common}
      # Security
      - APP_SECURITY__API_KEY=${APP_SECURITY__API_KEY:-dev-api-key-12345}
      # CSRF & session encryption keys (base64 encoded 32-byte values)
      - APP_SECURITY__CSRF_KEY=${APP_SECURITY__CSRF_KEY:-}
      - APP_SECURITY__SESSION_ENCRYPTION_KEY=${APP_SECURITY__SESSION_ENCRYPTION_KEY:-}
      - APP_SECURITY__SECRET_ENCRYPTION_KEY=${APP_SECURITY__SECRET_ENCRYPTION_KEY:-}
    networks:
      - aiwebengine-dev-network
    depends_on:
      postgres-dev:
        condition: service_healthy
    healthcheck:
      # curl is present in the development image, so this can be the real probe
      # /health rather than a TCP connect: it runs a SELECT 1 and answers 503
      # when Postgres is unreachable. The long start_period is the compile — a
      # cold container builds the whole crate before it listens, and until that
      # finishes the container reports "starting" rather than unhealthy.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 900s
    stdin_open: true
    tty: true

  # Development PostgreSQL
  postgres-dev:
    image: postgres:16-alpine
    container_name: aiwebengine-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=aiwebengine
      - POSTGRES_USER=aiwebengine
      - POSTGRES_PASSWORD=devpassword
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - aiwebengine-dev-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwebengine"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  aiwebengine-dev-network:
    driver: bridge

volumes:
  cargo-registry:
  cargo-git:
  target-cache:
  target-cache-2:
  postgres-dev-data:
  caddy-data:
  caddy-config:
